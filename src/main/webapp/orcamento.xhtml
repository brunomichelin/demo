<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xml:lang="pt-BR" lang="pt-BR">
<f:view>
    <h:head>
        <title>Orçamento da obra</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <h:outputStylesheet library="css" name="app.css"/>
    </h:head>
    <h:body styleClass="works-page budget-page">
        <h:form id="budgetForm">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <main class="budget-shell">
                <header class="budget-header">
                    <div>
                        <nav class="system-return-links" aria-label="Navegação principal">
                            <h:link outcome="indexObra.xhtml">Início</h:link><span> / </span>
                            <h:link outcome="gestao.xhtml" styleClass="budget-back-link">Painel de obras</h:link>
                        </nav>
                        <p class="budget-eyebrow">Planejamento financeiro</p>
                        <h1>Orçamento da obra</h1>
                        <p class="budget-subtitle">Organize versões e acompanhe os itens planejados por etapa.</p>
                    </div>
                    <span class="budget-header-icon" aria-hidden="true">R$</span>
                </header>

                <section class="budget-card budget-version-card">
                    <div class="budget-section-heading">
                        <span class="budget-section-icon" aria-hidden="true">00</span>
                        <div><p class="budget-eyebrow">Seleção</p><h2>Obra em análise</h2></div>
                    </div>
                    <div class="budget-field budget-field-wide">
                        <p:outputLabel for="obraSelect" value="Obra"/>
                        <p:selectOneMenu id="obraSelect" value="#{orcamentoBean.obraSelecionadaId}"
                                         disabled="#{not orcamentoBean.podeTrocarObra}">
                            <f:selectItem itemLabel="Selecione uma obra" itemValue="#{null}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{orcamentoBean.obras}" var="obra"
                                           itemLabel="#{obra.nome}" itemValue="#{obra.id}"/>
                            <p:ajax listener="#{orcamentoBean.carregarObra}" process="@this"
                                    update=":budgetForm"/>
                        </p:selectOneMenu>
                    </div>
                </section>

                <p:outputPanel id="statusMessage" layout="block" styleClass="budget-message">
                    <h:outputText value="#{orcamentoBean.mensagem}"/>
                </p:outputPanel>

                <section class="budget-card budget-version-card">
                    <div class="budget-section-heading">
                        <span class="budget-section-icon" aria-hidden="true">01</span>
                        <div><p class="budget-eyebrow">Controle de versões</p><h2>Versões do orçamento</h2></div>
                    </div>
                    <div class="budget-version-controls">
                        <div class="budget-field">
                            <p:outputLabel for="versao" value="Versão selecionada"/>
                            <p:selectOneMenu id="versao" value="#{orcamentoBean.versaoSelecionadaId}"
                                             disabled="#{empty orcamentoBean.versoes}">
                                <f:selectItem itemLabel="Selecione uma versão" itemValue="#{null}"
                                              noSelectionOption="true"/>
                                <f:selectItems value="#{orcamentoBean.versoes}" var="versao"
                                               itemLabel="Versão #{versao.numero}#{versao.congelada ? ' (congelada)' : ''}"
                                               itemValue="#{versao.id}"/>
                                <p:ajax listener="#{orcamentoBean.carregarItens}" process="@this"
                                        update=":budgetForm"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="budget-actions">
                            <p:commandButton value="Criar versão" icon="pi pi-plus"
                                             action="#{orcamentoBean.criarVersao}" process="@this"
                                             update=":budgetForm" disabled="#{not orcamentoBean.podeGerenciar or empty orcamentoBean.obras}"
                                             styleClass="budget-button budget-button-primary"/>
                            <p:commandButton value="Congelar versão" icon="pi pi-lock"
                                             action="#{orcamentoBean.congelarVersao}" process="@this"
                                             update=":budgetForm" rendered="#{orcamentoBean.podeCongelar}"
                                             disabled="#{empty orcamentoBean.versaoSelecionadaId or orcamentoBean.versaoCongelada}"
                                             styleClass="budget-button budget-button-secondary"/>
                        </div>
                    </div>
                </section>

                <section class="budget-card">
                    <div class="budget-section-heading">
                        <span class="budget-section-icon" aria-hidden="true">02</span>
                        <div><p class="budget-eyebrow">Composição</p><h2>Itens por etapa</h2></div>
                    </div>
                    <p:outputPanel id="itemEditor" layout="block" styleClass="budget-item-form">
                        <div class="budget-field">
                            <p:outputLabel for="etapa" value="Etapa da obra"/>
                            <p:selectOneMenu id="etapa" value="#{orcamentoBean.etapaSelecionadaId}"
                                             disabled="#{empty orcamentoBean.etapas}">
                                <f:selectItem itemLabel="Selecione uma etapa" itemValue="#{null}"
                                              noSelectionOption="true"/>
                                <f:selectItems value="#{orcamentoBean.etapas}" var="etapa"
                                               itemLabel="#{etapa.ordem} - #{etapa.nome}" itemValue="#{etapa.id}"/>
                                <p:ajax listener="#{orcamentoBean.carregarItens}" process="@this"
                                        update=":budgetForm:itemTable :budgetForm:itemTotals"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="budget-field">
                            <p:outputLabel for="insumo" value="Insumo"/>
                            <p:selectOneMenu id="insumo" value="#{orcamentoBean.insumoSelecionadoId}"
                                             disabled="#{empty orcamentoBean.insumos}">
                                <f:selectItem itemLabel="Selecione um insumo" itemValue="#{null}"
                                              noSelectionOption="true"/>
                                <f:selectItems value="#{orcamentoBean.insumos}" var="insumo"
                                               itemLabel="#{insumo.codigo} #{insumo.descricao}"
                                               itemValue="#{insumo.id}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="budget-field">
                            <p:outputLabel for="quantidade" value="Quantidade"/>
                            <p:inputNumber id="quantidade" value="#{orcamentoBean.quantidade}"
                                           minValue="0.001" decimalPlaces="3" placeholder="0,000"
                                           disabled="#{not orcamentoBean.podeGerenciar or orcamentoBean.versaoCongelada}"/>
                        </div>
                        <div class="budget-field">
                            <p:outputLabel for="valor" value="Preço unitário (opcional)"/>
                            <p:inputNumber id="valor" value="#{orcamentoBean.valorUnitario}"
                                           minValue="0.01" decimalPlaces="2"
                                           placeholder="Usar preço de referência"
                                           disabled="#{not orcamentoBean.podeGerenciar or orcamentoBean.versaoCongelada}"/>
                        </div>
                        <p:commandButton value="Adicionar item" icon="pi pi-plus"
                                         action="#{orcamentoBean.adicionarItem}" process="@this etapa insumo quantidade valor"
                                         update=":budgetForm" disabled="#{not orcamentoBean.podeGerenciar or orcamentoBean.versaoCongelada}"
                                         styleClass="budget-button budget-button-primary budget-add-button"/>
                    </p:outputPanel>
                    <p:outputPanel id="itemTable" layout="block" styleClass="budget-table-wrap">
                        <p:dataTable value="#{orcamentoBean.itens}" var="item"
                                     emptyMessage="Selecione uma etapa e versão para consultar os itens."
                                     styleClass="budget-pf-table">
                            <p:column headerText="Insumo">
                                <h:outputText value="#{item.insumo.descricao}"/>
                            </p:column>
                            <p:column headerText="Etapa">
                                <h:outputText value="#{item.etapa.nome}"/>
                            </p:column>
                            <p:column headerText="Quantidade" styleClass="budget-number-cell">
                                <h:outputText value="#{item.quantidade}">
                                    <f:convertNumber locale="pt_BR" minFractionDigits="3" maxFractionDigits="3"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Preço unitário" styleClass="budget-number-cell">
                                <h:outputText value="#{item.valorUnitario}">
                                    <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Total" styleClass="budget-number-cell">
                                <h:outputText value="#{item.quantidade.multiply(item.valorUnitario)}">
                                    <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                                </h:outputText>
                            </p:column>
                        </p:dataTable>
                    </p:outputPanel>
                    <p:outputPanel id="itemTotals" layout="block" styleClass="budget-total">
                        <span>Total da etapa</span>
                        <strong><h:outputText value="#{orcamentoBean.totalItens}">
                            <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                        </h:outputText></strong>
                    </p:outputPanel>
                </section>
            </main>
        </h:form>
    </h:body>
</f:view>
</html>
