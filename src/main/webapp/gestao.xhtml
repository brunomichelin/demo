<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xml:lang="pt-BR" lang="pt-BR">
<h:head>
    <title>Painel de obras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="css" name="app.css"/>
</h:head>
<h:body styleClass="works-page dashboard-page">
    <main class="dashboard-shell">
        <header class="dashboard-header">
            <div>
                <p:link styleClass="dashboard-back-link" outcome="indexObra.xhtml">← Início</p:link>
                <p class="dashboard-eyebrow">Visão geral</p>
                <h1>Suas obras</h1>
                <p class="dashboard-subtitle">Acesse projetos e acompanhe cada etapa do trabalho.</p>
                <p:link styleClass="dashboard-financing-link" outcome="financiamento.xhtml">
                    Simulador de financiamento <span aria-hidden="true">→</span>
                </p:link>
            </div>
            <div class="dashboard-header-mark" aria-hidden="true">
                <span class="home-card-arrow pi pi-building" aria-hidden="true"></span>
            </div>
        </header>
        <h:form id="dashboardForm">
            <p:outputPanel id="mensagem" layout="block" styleClass="dashboard-message dashboard-empty"
                           rendered="#{empty gestaoBean.obras}">
                <h:outputText value="#{gestaoBean.mensagem}"/>
            </p:outputPanel>
            <p:outputPanel id="obras" layout="block" styleClass="dashboard-grid">
                <ui:repeat value="#{gestaoBean.obras}" var="obra">
                    <section class="dashboard-card">
                        <div class="dashboard-card-top">
                            <span class="dashboard-card-icon pi pi-home" aria-hidden="true"></span>
                            <span class="dashboard-status"><h:outputText value="#{obra.status}"/></span>
                        </div>
                        <div class="dashboard-card-heading"><h2><h:outputText value="#{obra.nome}"/></h2></div>
                        <div class="dashboard-card-divider"></div>
                        <div class="dashboard-card-links">
                            <p:link styleClass="dashboard-link" outcome="detailObra.xhtml"
                                    rendered="#{gestaoBean.podeDetalhes}">
                                Detalhes <f:param name="id" value="#{obra.id}"/>
                            </p:link>
                            <p:link styleClass="dashboard-link" outcome="orcamento.xhtml"
                                    rendered="#{gestaoBean.podeOrcamento}">
                                Orçamento <f:param name="obraId" value="#{obra.id}"/>
                            </p:link>
                            <p:link styleClass="dashboard-link" outcome="custos.xhtml"
                                    rendered="#{gestaoBean.podeCustos}">
                                Custos <f:param name="obraId" value="#{obra.id}"/>
                            </p:link>
                            <p:link styleClass="dashboard-link" outcome="entregas.xhtml"
                                    rendered="#{gestaoBean.podeEntregas}">
                                Entregas <f:param name="obraId" value="#{obra.id}"/>
                            </p:link>
                            <p:link styleClass="dashboard-link" outcome="relatorios.xhtml"
                                    rendered="#{gestaoBean.podeRelatorios}">
                                Relatórios <f:param name="obraId" value="#{obra.id}"/>
                            </p:link>
                            <p:link styleClass="dashboard-link" outcome="desempenho.xhtml"
                                    rendered="#{gestaoBean.podeDesempenho}">
                                Desempenho <f:param name="obraId" value="#{obra.id}"/>
                            </p:link>
                        </div>
                    </section>
                </ui:repeat>
            </p:outputPanel>
        </h:form>
    </main>
</h:body>
</html>
