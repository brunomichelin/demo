<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      lang="pt-BR">
<h:head>
    <title>Entrar | Sistemas de Bruno Michelin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="css" name="app.css"/>
</h:head>
<h:body styleClass="auth-page login-page">
    <main class="login-shell">
        <a class="login-brand" href="index.xhtml" aria-label="Sistemas de Bruno Michelin - início">
            <span class="login-brand-mark" aria-hidden="true">
                <span class="pi pi-building" aria-hidden="true"></span>
            </span>
            <span>SISTEMAS <strong>BRUNO MICHELIN</strong></span>
        </a>
        <section class="login-card">
            <header class="login-heading">
                <p class="login-eyebrow">Acesso à plataforma</p>
                <h1>Bem-vindo</h1>
                <p>Entre com suas credenciais para acessar seus sistemas.</p>
            </header>
            <h:form id="loginForm" prependId="false" styleClass="login-form">
                <label for="email">E-mail</label>
                <p:inputText id="email" autocomplete="username" required="true"/>
                <label for="senha">Senha</label>
                <p:password id="senha" autocomplete="current-password" feedback="false" required="true"/>
                <p:commandButton id="submitButton" type="button" value="Entrar"
                                 onclick="submitLogin(); return false;"/>
                <p id="erro" role="alert" aria-live="polite"></p>
                <div class="login-register">
                    <span>Ainda não tem uma conta?</span>
                    <a id="cadastro" href="cadastro.xhtml">Criar uma conta</a>
                </div>
            </h:form>
        </section>
        <footer class="login-footer">Sistema de Gestão de Obras <span>•</span> Planejamento, controle e transparência</footer>
    </main>
    <script type="text/javascript">
        //<![CDATA[
        const form = document.getElementById('loginForm');
        const button = document.getElementById('submitButton');
        const error = document.getElementById('erro');
        if (new URLSearchParams(window.location.search).get('cadastro') === 'pendente') {
            error.style.color = '#176b2c';
            error.textContent = 'Cadastro recebido. Aguarde a aprovação do administrador para entrar.';
        }

        async function submitLogin(event) {
            if (event) event.preventDefault();
            if (!form.reportValidity()) return;
            button.disabled = true;
            error.textContent = '';

            try {
                const response = await fetch(`#{'${'}window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'))}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        senha: document.getElementById('senha').value
                    })
                });

                if (!response.ok) {
                    error.textContent = 'E-mail ou senha inválidos.';
                    return;
                }

                const requested = new URLSearchParams(window.location.search).get('redirect');
                const destination = requested && requested.startsWith('/') && !requested.startsWith('//')
                    ? requested
                    : `#{'${'}window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'))}/index.xhtml`;
                window.location.assign(destination);
            } catch (e) {
                error.textContent = 'Não foi possível conectar ao servidor.';
            } finally {
                button.disabled = false;
            }
        }
        form.addEventListener('submit', submitLogin);
        form.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && event.target instanceof HTMLInputElement) {
                event.preventDefault();
                submitLogin(event);
            }
        });
        //]]>
    </script>
</h:body>
</html>
