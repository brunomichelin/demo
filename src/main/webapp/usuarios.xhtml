<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xml:lang="pt-BR" lang="pt-BR">
<h:head>
    <title>Administração de usuários</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="css" name="app.css"/>
</h:head>
<h:body styleClass="works-page users-page">
    <main class="admin-users">
        <header class="users-header">
            <div>
                <p:link styleClass="users-back-link" outcome="index.xhtml">Início</p:link>
                <p class="users-eyebrow">Administração</p>
                <h1>Usuários</h1>
                <p class="users-subtitle">Gerencie os acessos, papéis e solicitações de cadastro.</p>
            </div>
            <div class="users-header-mark" aria-hidden="true">U</div>
        </header>
        <h:form id="usersForm">
            <p:messages id="messages" showDetail="true" closable="true" styleClass="users-message"/>
            <section class="users-card">
                <div class="users-section-heading">
                    <div><p class="users-eyebrow">Cadastro</p><h2>Dados do usuário</h2></div>
                    <span class="users-heading-icon" aria-hidden="true">+</span>
                </div>
                <p:outputPanel id="userEditor" layout="block" styleClass="users-form">
                    <div class="users-field">
                        <label for="nome">Nome completo</label>
                        <p:inputText id="nome" value="#{usuariosBean.nome}" required="true" maxlength="160"
                                     placeholder="Ex.: Maria da Silva"/>
                    </div>
                    <div class="users-field">
                        <label for="email">E-mail</label>
                        <p:inputText id="email" value="#{usuariosBean.email}" required="true" maxlength="180"
                                     type="email" placeholder="nome@empresa.com"/>
                    </div>
                    <div class="users-field">
                        <label for="telefone">Telefone</label>
                        <p:inputText id="telefone" value="#{usuariosBean.telefone}" maxlength="40"
                                     placeholder="(00) 00000-0000"/>
                    </div>
                    <div class="users-field">
                        <label for="papel">Papel de acesso</label>
                        <p:selectOneMenu id="papel" value="#{usuariosBean.papel}" required="true">
                            <f:selectItems value="#{usuariosBean.papeis}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="users-field users-field-password">
                        <label for="senha">Senha <span>(mínimo 8 caracteres; deixe vazia ao editar)</span></label>
                        <p:password id="senha" value="#{usuariosBean.senha}" feedback="false"
                                    autocomplete="new-password" placeholder="Informe uma senha segura"/>
                    </div>
                    <div class="users-form-actions">
                        <p:commandButton value="Salvar usuário" icon="pi pi-plus"
                                         action="#{usuariosBean.salvar}" styleClass="users-button users-button-primary"
                                         process="userEditor" update="messages userEditor userTable"/>
                        <p:commandButton value="Limpar campos" icon="pi pi-times"
                                         action="#{usuariosBean.limpar}" styleClass="users-button users-button-secondary"
                                         process="@this" update="userEditor"/>
                    </div>
                </p:outputPanel>
            </section>
            <section class="users-card users-list-card">
                <div class="users-section-heading">
                    <div><p class="users-eyebrow">Acessos do sistema</p><h2>Usuários cadastrados</h2></div>
                    <span class="users-list-caption">Contas e solicitações</span>
                </div>
                <div class="users-table-wrap">
                    <p:dataTable id="userTable" value="#{usuariosBean.usuarios}" var="usuario"
                                 styleClass="users-table" rows="10" paginator="true"
                                 paginatorPosition="bottom" emptyMessage="Nenhum usuário cadastrado.">
                        <p:column headerText="Usuário" sortBy="#{usuario.nome}">
                            <span class="users-name"><h:outputText value="#{usuario.nome}"/></span>
                            <span class="users-email"><h:outputText value="#{usuario.email}"/></span>
                        </p:column>
                        <p:column headerText="Telefone">
                            <h:outputText value="#{empty usuario.telefone ? '-' : usuario.telefone}"/>
                        </p:column>
                        <p:column headerText="Papel solicitado/atual" sortBy="#{usuario.papel}">
                            <h:outputText value="#{usuario.papel.descricao}"/>
                        </p:column>
                        <p:column headerText="Status" sortBy="#{usuario.statusRegistro}">
                            <span class="users-status users-status-#{usuariosBean.statusCss(usuario.statusRegistro)}">
                                <h:outputText value="#{usuariosBean.statusLegivel(usuario.statusRegistro)}"/>
                            </span>
                        </p:column>
                        <p:column headerText="Ações" styleClass="users-actions-column">
                            <p:commandButton value="Aprovar" icon="pi pi-check"
                                             rendered="#{usuario.statusRegistro.name() eq 'PENDENTE'}"
                                             action="#{usuariosBean.aprovar(usuario)}"
                                             styleClass="users-button users-button-approve"
                                             process="@this" update="messages userTable"/>
                            <p:commandButton value="Editar" icon="pi pi-pencil"
                                             action="#{usuariosBean.editar(usuario)}"
                                             styleClass="users-button users-button-edit"
                                             process="@this" update="userEditor messages"/>
                            <p:commandButton value="Excluir" icon="pi pi-trash"
                                             action="#{usuariosBean.excluir(usuario)}"
                                             styleClass="users-button users-button-delete"
                                             process="@this" update="messages userTable">
                                <p:confirm header="Confirmar exclusão"
                                           message="Deseja excluir este usuário?"
                                           icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </div>
            </section>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true">
                <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes users-button users-button-delete"
                                 icon="pi pi-check"/>
                <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no users-button users-button-secondary"
                                 icon="pi pi-times"/>
            </p:confirmDialog>
        </h:form>
    </main>
</h:body>
</html>
