<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xml:lang="pt-BR" lang="pt-BR">
<h:head>
    <title>Relatórios da obra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="css" name="app.css"/>
</h:head>
<h:body styleClass="works-page reports-page">
    <main class="reports-shell">
        <header class="reports-header">
            <div>
                <nav class="system-return-links" aria-label="Navegação principal">
                    <p:link outcome="indexObra.xhtml">Início</p:link><span> / </span>
                    <p:link styleClass="reports-back-link" outcome="gestao.xhtml">Painel de obras</p:link>
                </nav>
                <p class="reports-eyebrow">Dados para decisão</p>
                <h1>Relatórios da obra</h1>
                <p class="reports-subtitle">Consulte custos, insumos, tarefas e prazos. Visualize ou exporte os resultados.</p>
            </div>
            <span class="reports-header-icon" aria-hidden="true">▤</span>
        </header>
        <h:form id="reportsForm">
            <section class="reports-card">
                <div class="reports-section-heading">
                    <span class="reports-section-icon" aria-hidden="true">00</span>
                    <div><p class="reports-eyebrow">Seleção</p><h2>Obra em análise</h2></div>
                </div>
                <div class="reports-field">
                    <label for="obraSelect">Obra</label>
                    <p:selectOneMenu id="obraSelect" value="#{relatoriosBean.obraId}"
                                     styleClass="reports-select" disabled="#{empty relatoriosBean.obras}">
                        <f:selectItems value="#{relatoriosBean.obras}" var="obra"
                                       itemValue="#{obra.id}" itemLabel="#{obra.nome}"/>
                        <p:ajax process="@this" listener="#{relatoriosBean.limparResultado}"
                                update="status resultArea downloadArea"/>
                    </p:selectOneMenu>
                </div>
            </section>
            <section class="reports-card">
                <div class="reports-section-heading">
                    <span class="reports-section-icon" aria-hidden="true">01</span>
                    <div><p class="reports-eyebrow">Configuração</p><h2>Gerar relatório</h2></div>
                </div>
                <div class="reports-form">
                    <div class="reports-field reports-field-wide">
                        <label for="tipo">Tipo de relatório</label>
                        <p:selectOneMenu id="tipo" value="#{relatoriosBean.tipoRelatorio}">
                            <f:selectItems value="#{relatoriosBean.tiposRelatorio}"/>
                            <p:ajax event="change" process="@this" listener="#{relatoriosBean.limparResultado}"
                                    update="status resultArea downloadArea"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="reports-field">
                        <label for="formato">Formato de saída</label>
                        <p:selectOneMenu id="formato" value="#{relatoriosBean.formato}">
                            <f:selectItem itemValue="json" itemLabel="Visualizar na tela"/>
                            <f:selectItem itemValue="pdf" itemLabel="Documento PDF"/>
                            <f:selectItem itemValue="xlsx" itemLabel="Planilha Excel (XLSX)"/>
                            <p:ajax event="change" process="@this" listener="#{relatoriosBean.limparResultado}"
                                    update="status resultArea downloadArea"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="reports-field">
                        <label for="versao">Versão do orçamento <span>(opcional)</span></label>
                        <p:inputText id="versao" type="number" min="1" value="#{relatoriosBean.versaoId}"
                                     placeholder="Versão mais recente">
                            <p:ajax event="change" process="@this" listener="#{relatoriosBean.limparResultado}"
                                    update="status resultArea downloadArea"/>
                        </p:inputText>
                    </div>
                    <p:commandButton value="Gerar relatório" icon="pi pi-arrow-up-right"
                                     action="#{relatoriosBean.gerar}" styleClass="reports-button"
                                     process="@form" update="status resultArea downloadArea"/>
                </div>
            </section>
            <p:outputPanel id="status" layout="block" styleClass="reports-message">
                <h:outputText value="#{relatoriosBean.mensagem}"/>
            </p:outputPanel>
            <section class="reports-card reports-result-card">
                <div class="reports-section-heading">
                    <span class="reports-section-icon" aria-hidden="true">02</span>
                    <div><p class="reports-eyebrow">Resultado</p><h2>Visualização</h2></div>
                </div>
                <p:outputPanel id="resultArea" layout="block">
                    <pre aria-live="polite"><h:outputText value="#{relatoriosBean.resultado}"/></pre>
                </p:outputPanel>
                <p:outputPanel id="downloadArea" layout="block">
                    <p:commandButton value="Baixar arquivo" icon="pi pi-download"
                                     styleClass="reports-button reports-download-button"
                                     ajax="false" rendered="#{relatoriosBean.arquivoDisponivel}">
                        <p:fileDownload value="#{relatoriosBean.arquivo}"/>
                    </p:commandButton>
                </p:outputPanel>
            </section>
        </h:form>
    </main>
</h:body>
</html>
